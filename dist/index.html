<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web ADB Inspector</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #ff5252;
    --yellow: #d29922;
    --orange: #db6d28;
    --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    --font-scale: 1;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: calc(14px * var(--font-scale));
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .hidden { display: none !important; }
  .empty-hint { text-align: center; color: var(--muted); padding: 1rem; font-style: italic; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-size: calc(1rem * var(--font-scale));
  }
  .header h1 { font-size: calc(1rem * var(--font-scale)); font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .header-controls { display: flex; align-items: center; gap: 0.5rem; }
  .badge {
    font-size: calc(0.7rem * var(--font-scale));
    padding: 0.2rem 0.5rem;
    border-radius: 9999px;
    background: var(--border);
  }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.err { background: rgba(255,82,82,0.15); color: var(--red); }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0.35rem 0.85rem;
    border-radius: 6px;
    font-size: calc(0.8rem * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sm {
    background: var(--border);
    color: var(--text);
    padding: 0.2rem 0.5rem;
    font-size: calc(0.7rem * var(--font-scale));
  }
  .btn-export { background: var(--green); color: #000; padding: 0.3rem 0.7rem; font-size: calc(0.75rem * var(--font-scale)); font-weight: 600; }
  .font-btn {
    background: var(--border);
    color: var(--text);
    border: none;
    width: calc(24px * var(--font-scale));
    height: calc(24px * var(--font-scale));
    border-radius: 4px;
    font-size: calc(0.9rem * var(--font-scale));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .font-btn:hover { color: var(--accent); }

  /* Main layout */
  .main { display: flex; min-height: calc(100vh - 48px); }

  /* Sidebar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem;
    overflow-y: auto;
  }
  .welcome-msg { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  .welcome-msg .icon { font-size: 3rem; margin-bottom: 1rem; }
  .welcome-msg p { font-size: calc(0.85rem * var(--font-scale)); }
  .device-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .device-card:hover { border-color: var(--accent); }
  .device-card.active { border-color: var(--accent); background: rgba(88,166,255,0.06); }
  .dev-nick { font-size: calc(0.75rem * var(--font-scale)); color: var(--yellow); font-style: italic; }
  .dev-name { font-weight: 600; font-size: calc(0.85rem * var(--font-scale)); }
  .dev-serial { font-size: calc(0.7rem * var(--font-scale)); color: var(--muted); font-family: var(--mono); }

  /* Content area */
  .content {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
    max-height: calc(100vh - 48px);
  }
  .device-header {
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .device-header h2 { font-size: calc(1.1rem * var(--font-scale)); }
  .device-header-actions { display: flex; gap: 0.5rem; align-items: center; }
  .nickname-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: calc(0.75rem * var(--font-scale));
    width: 140px;
  }
  .nickname-input:focus { outline: none; border-color: var(--accent); }

  /* Tabs */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .tab {
    padding: 0.5rem 1rem;
    font-size: calc(0.8rem * var(--font-scale));
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .panel-header h3 { font-size: calc(0.85rem * var(--font-scale)); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .panel-actions { display: flex; gap: 0.3rem; align-items: center; }

  /* Search */
  .search-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: calc(0.75rem * var(--font-scale));
    width: 200px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); font-size: calc(0.7rem * var(--font-scale)); }

  /* Property list - grid layout for alignment */
  .props-output {
    font-family: var(--mono);
    font-size: calc(0.75rem * var(--font-scale));
    max-height: 60vh;
    overflow-y: auto;
  }
  .prop-row {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem;
    padding: 0.2rem 0;
    border-bottom: 1px solid rgba(48,54,61,0.4);
  }
  .prop-key {
    color: var(--accent);
    white-space: nowrap;
  }
  .prop-val {
    color: var(--text);
    word-break: break-all;
    overflow-wrap: break-word;
  }
  .prop-count {
    font-size: calc(0.7rem * var(--font-scale));
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  /* Features & Packages */
  .feat-item, .pkg-item {
    padding: 0.15rem 0;
    border-bottom: 1px solid rgba(48,54,61,0.4);
    font-family: var(--mono);
    font-size: calc(0.75rem * var(--font-scale));
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .pkg-item { cursor: pointer; }
  .pkg-item:hover { background: rgba(88,166,255,0.04); }
  .feat-type {
    font-size: calc(0.6rem * var(--font-scale));
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    background: rgba(88,166,255,0.15);
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .feat-type.other { background: rgba(139,148,158,0.15); color: var(--muted); }
  .feat-ver, .pkg-ver { color: var(--muted); font-size: calc(0.65rem * var(--font-scale)); flex-shrink: 0; }
  .pkg-badge {
    font-size: calc(0.6rem * var(--font-scale));
    padding: 0.1rem 0.3rem;
    border-radius: 3px;
    font-weight: 600;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .pkg-badge.priv { background: rgba(219,109,40,0.15); color: var(--orange); }
  .pkg-badge.sys { background: rgba(139,148,158,0.15); color: var(--muted); }
  .pkg-toggle {
    margin-left: auto;
    font-size: calc(0.6rem * var(--font-scale));
    color: var(--muted);
    flex-shrink: 0;
  }
  .pkg-detail {
    padding: 0.4rem 0.4rem 0.4rem 1rem;
    font-size: calc(0.7rem * var(--font-scale));
    color: var(--muted);
    border-left: 2px solid var(--border);
    margin: 0.15rem 0 0.15rem 0.3rem;
  }
  .pkg-detail-row { padding: 0.1rem 0; }
  .pkg-detail-label { color: var(--accent); font-weight: 600; margin-right: 0.3rem; }
  .pkg-path { word-break: break-all; font-family: var(--mono); font-size: calc(0.65rem * var(--font-scale)); }
  .pkg-perms { margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0.15rem; }
  .pkg-perm-item {
    background: rgba(139,148,158,0.1);
    padding: 0.08rem 0.3rem;
    border-radius: 3px;
    font-size: calc(0.62rem * var(--font-scale));
    font-family: var(--font-scale, var(--mono));
  }
  .pkg-perm-status { margin-left: 0.2rem; font-size: calc(0.55rem * var(--font-scale)); }
  .pkg-perm-more { color: var(--muted); font-style: italic; font-size: calc(0.62rem * var(--font-scale)); }

  /* Shell */
  .shell-bar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .shell-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: calc(0.8rem * var(--font-scale));
  }
  .shell-bar input:focus { outline: none; border-color: var(--accent); }
  .shell-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: var(--mono);
    font-size: calc(0.75rem * var(--font-scale));
    white-space: pre-wrap;
    max-height: 35vh;
    overflow-y: auto;
    min-height: 120px;
  }
  .quick-btns { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.5rem; }

  /* Status table */
  .status-table { width: 100%; border-collapse: collapse; font-size: calc(0.8rem * var(--font-scale)); }
  .status-table th, .status-table td {
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .status-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: calc(0.7rem * var(--font-scale));
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-table td[title] { cursor: help; }
  .status-table td[title]:hover { color: var(--accent); }
  .status-ok { color: var(--green); font-weight: 600; }
  .status-fail { color: var(--red); font-weight: 600; }
  .status-warn { color: var(--yellow); font-weight: 600; }
  .status-unknown { color: var(--muted); }
  .rkp-source code {
    font-size: calc(0.65rem * var(--font-scale));
    background: var(--bg);
    padding: 0.1rem 0.3rem;
    border-radius: 3px;
    color: var(--muted);
  }

  /* Loading */
  .loading {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; min-width: auto; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
    .content { max-height: none; }
    .prop-row { grid-template-columns: 180px 1fr; }
  }

  /* Footer */
  .app-footer {
    text-align: center;
    padding: 0.6rem;
    font-size: calc(0.7rem * var(--font-scale));
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .app-footer code {
    font-family: var(--mono);
    background: var(--bg);
    padding: 0.1rem 0.3rem;
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Web</span> ADB Inspector <span id="header-version" style="color:var(--muted);font-weight:400;font-size:calc(0.8rem * var(--font-scale))"></span></h1>
  <div class="header-controls">
    <span id="webusb-status" class="badge">Checking...</span>
    <button class="font-btn" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
    <button class="font-btn" onclick="changeFontSize(1)" title="Increase font size">A+</button>
    <button id="btn-scan" class="btn" onclick="scanDevices()">+ Connect Device</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div id="welcome-msg" class="welcome-msg">
      <div class="icon">&#x1F4F1;</div>
      <p>No devices connected</p>
      <p style="margin-top:0.5rem;font-size:calc(0.75rem * var(--font-scale))">Click <strong>+ Connect Device</strong> to connect via USB</p>
    </div>
    <div id="device-list"></div>
  </div>

  <div class="content">
    <div id="inspector-section" class="hidden">
      <div class="device-header">
        <h2 id="selected-device-name"></h2>
        <div class="device-header-actions">
          <input id="nickname-input" class="nickname-input" type="text" placeholder="Device nickname..." onkeydown="if(event.key==='Enter')setNickname()">
          <button class="btn btn-sm" onclick="setNickname()">Save</button>
          <button class="btn btn-sm" onclick="disconnectDevice()">Disconnect</button>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab active" onclick="switchTab(this, 'tab-props')">Properties</div>
        <div class="tab" onclick="switchTab(this, 'tab-features')">Features</div>
        <div class="tab" onclick="switchTab(this, 'tab-packages')">Packages</div>
        <div class="tab" onclick="switchTab(this, 'tab-attestation')">Attestation</div>
        <div class="tab" onclick="switchTab(this, 'tab-rkp')">RKP</div>
        <div class="tab" onclick="switchTab(this, 'tab-shell')">Shell</div>
      </div>

      <!-- Properties Tab -->
      <div id="tab-props" class="tab-content active">
        <div class="panel">
          <div class="panel-header">
            <h3>System Properties <span id="props-count" style="color:var(--accent)"></span></h3>
            <div class="panel-actions">
              <input id="search-props" class="search-input" type="text" placeholder="Search properties..." oninput="renderProperties(dataCache.props)">
              <span id="props-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('props')">Export JSON</button>
            </div>
          </div>
          <div id="props-output" class="props-output"></div>
        </div>
      </div>

      <!-- Features Tab -->
      <div id="tab-features" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Package Manager Features <span id="features-count" style="color:var(--accent)"></span></h3>
            <div class="panel-actions">
              <input id="search-features" class="search-input" type="text" placeholder="Search features..." oninput="renderFeatures(dataCache.features)">
              <span id="features-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('features')">Export JSON</button>
            </div>
          </div>
          <div id="features-output" class="features-output"></div>
        </div>
      </div>

      <!-- Packages Tab -->
      <div id="tab-packages" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Packages <span id="packages-count" style="color:var(--accent)"></span></h3>
            <div class="panel-actions">
              <input id="search-packages" class="search-input" type="text" placeholder="Search packages..." oninput="renderPackages(dataCache.packages)">
              <span id="packages-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('packages')">Export JSON</button>
            </div>
          </div>
          <div id="packages-output" class="packages-output"></div>
        </div>
      </div>

      <!-- Attestation Tab -->
      <div id="tab-attestation" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Key Attestation Status</h3>
            <div><span id="attestation-loading" class="loading hidden"></span></div>
          </div>
          <div id="attestation-output"></div>
        </div>
      </div>

      <!-- RKP Tab -->
      <div id="tab-rkp" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Remote Key Provisioning Status</h3>
            <div><span id="rkp-loading" class="loading hidden"></span></div>
          </div>
          <div id="rkp-output"></div>
        </div>
      </div>

      <!-- Shell Tab -->
      <div id="tab-shell" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>ADB Shell</h3>
          </div>
          <div class="quick-btns">
            <button class="btn btn-sm" onclick="runCmd('getprop ro.build.version.release')">Android Ver</button>
            <button class="btn btn-sm" onclick="runCmd('getprop ro.product.model')">Model</button>
            <button class="btn btn-sm" onclick="runCmd('getprop ro.hardware')">Hardware</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys battery')">Battery</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys display')">Display</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys wifi')">WiFi</button>
          </div>
          <div class="shell-bar">
            <input id="shell-input" type="text" placeholder="adb shell command..." onkeydown="if(event.key==='Enter')runShell()">
            <button class="btn" onclick="runShell()">Run</button>
          </div>
          <div id="shell-output" class="shell-output"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer (version moved to header) -->
<div id="app-footer" class="app-footer">
  Web ADB Inspector
</div>

<script type="module" src="bundle.js"></script>
</body>
</html>
