<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web ADB Inspector</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #ff5252;
    --yellow: #d29922;
    --orange: #db6d28;
    --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .header h1 { font-size: 1rem; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 9999px;
    background: var(--border);
  }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.err { background: rgba(255,82,82,0.15); color: var(--red); }
  .badge.warn { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0.35rem 0.85rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sm {
    background: var(--border);
    color: var(--text);
    padding: 0.2rem 0.5rem;
    font-size: 0.7rem;
  }
  .btn-export {
    background: var(--green);
    color: #000;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* Main layout */
  .main {
    display: flex;
    min-height: calc(100vh - 48px);
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem;
    overflow-y: auto;
  }
  .welcome-msg {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }
  .welcome-msg .icon { font-size: 3rem; margin-bottom: 1rem; }
  .welcome-msg p { font-size: 0.85rem; }
  .device-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .device-card:hover { border-color: var(--accent); }
  .device-card.active { border-color: var(--accent); background: rgba(88,166,255,0.06); }
  .dev-name { font-weight: 600; font-size: 0.85rem; }
  .dev-serial { font-size: 0.7rem; color: var(--muted); font-family: var(--mono); }

  /* Content area */
  .content {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
    max-height: calc(100vh - 48px);
  }
  .device-header {
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .device-header h2 { font-size: 1.1rem; }

  /* Tabs */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .tab {
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  .panel-header h3 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Property list - value pair format */
  .props-output {
    font-family: var(--mono);
    font-size: 0.75rem;
    max-height: 60vh;
    overflow-y: auto;
  }
  .prop-row {
    display: flex;
    padding: 0.2rem 0;
    border-bottom: 1px solid rgba(48,54,61,0.4);
    gap: 0.5rem;
  }
  .prop-key {
    color: var(--accent);
    min-width: 320px;
    word-break: break-all;
  }
  .prop-val {
    color: var(--text);
    word-break: break-all;
    flex: 1;
  }
  .prop-count {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  /* Features & Packages */
  .feat-item, .pkg-item {
    padding: 0.15rem 0;
    border-bottom: 1px solid rgba(48,54,61,0.4);
    font-family: var(--mono);
    font-size: 0.75rem;
  }

  /* Shell */
  .shell-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .shell-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  .shell-bar input:focus { outline: none; border-color: var(--accent); }
  .shell-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    white-space: pre-wrap;
    max-height: 35vh;
    overflow-y: auto;
    min-height: 120px;
  }
  .quick-btns {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }

  /* Status table for attestation/RKP */
  .status-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  .status-table th, .status-table td {
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .status-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-ok { color: var(--green); font-weight: 600; }
  .status-fail { color: var(--red); font-weight: 600; }
  .status-warn { color: var(--yellow); font-weight: 600; }
  .status-unknown { color: var(--muted); }

  /* Loading */
  .loading {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; min-width: auto; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
    .content { max-height: none; }
    .prop-key { min-width: 180px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Web</span> ADB Inspector</h1>
  <div style="display:flex;align-items:center;gap:0.5rem;">
    <span id="webusb-status" class="badge">Checking...</span>
    <button id="btn-scan" class="btn" onclick="scanDevices()">+ Connect Device</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div id="welcome-msg" class="welcome-msg">
      <div class="icon">&#x1F4F1;</div>
      <p>No devices connected</p>
      <p style="margin-top:0.5rem;font-size:0.75rem;">Click <strong>+ Connect Device</strong> to connect via USB</p>
    </div>
    <div id="device-list"></div>
  </div>

  <div class="content">
    <div id="inspector-section" class="hidden">
      <div class="device-header">
        <h2 id="selected-device-name"></h2>
        <button class="btn btn-sm" onclick="disconnectDevice()">Disconnect</button>
      </div>

      <div class="tab-bar">
        <div class="tab active" onclick="switchTab(this, 'tab-props')">Properties</div>
        <div class="tab" onclick="switchTab(this, 'tab-features')">Features</div>
        <div class="tab" onclick="switchTab(this, 'tab-packages')">Packages</div>
        <div class="tab" onclick="switchTab(this, 'tab-attestation')">Attestation</div>
        <div class="tab" onclick="switchTab(this, 'tab-rkp')">RKP</div>
        <div class="tab" onclick="switchTab(this, 'tab-shell')">Shell</div>
      </div>

      <!-- Properties Tab -->
      <div id="tab-props" class="tab-content active">
        <div class="panel">
          <div class="panel-header">
            <h3>System Properties <span id="props-count" style="color:var(--accent)"></span></h3>
            <div style="display:flex;gap:0.3rem;align-items:center;">
              <span id="props-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('props')">Export JSON</button>
            </div>
          </div>
          <div id="props-output" class="props-output"></div>
        </div>
      </div>

      <!-- Features Tab -->
      <div id="tab-features" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Package Manager Features <span id="features-count" style="color:var(--accent)"></span></h3>
            <div style="display:flex;gap:0.3rem;align-items:center;">
              <span id="features-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('features')">Export JSON</button>
            </div>
          </div>
          <div id="features-output" class="features-output"></div>
        </div>
      </div>

      <!-- Packages Tab -->
      <div id="tab-packages" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Third-Party Packages <span id="packages-count" style="color:var(--accent)"></span></h3>
            <div style="display:flex;gap:0.3rem;align-items:center;">
              <span id="packages-loading" class="loading hidden"></span>
              <button class="btn btn-sm btn-export" onclick="exportJSON('packages')">Export JSON</button>
            </div>
          </div>
          <div id="packages-output" class="packages-output"></div>
        </div>
      </div>

      <!-- Attestation Tab -->
      <div id="tab-attestation" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Key Attestation Status</h3>
            <div><span id="attestation-loading" class="loading hidden"></span></div>
          </div>
          <div id="attestation-output"></div>
        </div>
      </div>

      <!-- RKP Tab -->
      <div id="tab-rkp" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>Remote Key Provisioning Status</h3>
            <div><span id="rkp-loading" class="loading hidden"></span></div>
          </div>
          <div id="rkp-output"></div>
        </div>
      </div>

      <!-- Shell Tab -->
      <div id="tab-shell" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <h3>ADB Shell</h3>
          </div>
          <div class="quick-btns">
            <button class="btn btn-sm" onclick="runCmd('getprop ro.build.version.release')">Android Ver</button>
            <button class="btn btn-sm" onclick="runCmd('getprop ro.product.model')">Model</button>
            <button class="btn btn-sm" onclick="runCmd('getprop ro.hardware')">Hardware</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys battery')">Battery</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys display')">Display</button>
            <button class="btn btn-sm" onclick="runCmd('dumpsys wifi')">WiFi</button>
          </div>
          <div class="shell-bar">
            <input id="shell-input" type="text" placeholder="adb shell command..." onkeydown="if(event.key==='Enter')runShell()">
            <button class="btn" onclick="runShell()">Run</button>
          </div>
          <div id="shell-output" class="shell-output"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="bundle.js"></script>
</body>
</html>
