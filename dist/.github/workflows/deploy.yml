name: Build and deploy from web-adb-tool

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (Ethanhsu.github.io)
        uses: actions/checkout@v4

      - name: Clone web-adb-tool
        run: |
          git clone https://github.com/Ethanhsu/web-adb-inspector.git ../web-adb-tool

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install & build
        working-directory: ../web-adb-tool
        run: |
          npm ci
          node build.mjs

      - name: Copy built files
        run: |
          rm -f index.html bundle.js bundle.js.map
          cp -f ../web-adb-tool/dist/* .

      - name: Commit & push if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A
          git status --short | grep -q . && git commit -m "auto-deploy: built from web-adb-tool" || echo "no changes"
          git push
